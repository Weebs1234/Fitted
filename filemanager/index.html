<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Getfitted - Webspace</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="webspace-section">
            <span class="webspace-label">Webspace</span>
            <div class="webspace-dropdown">
                <select id="webspace-select">
                    <option value="getfitted">Getfitted</option>
                </select>
            </div>
            <div class="storage-info">
                <span>20,41 MB van 100 MB in gebruik</span>
                <div class="progress-container">
                    <div class="progress-bar" style="width: 20.41%"></div>
                </div>
            </div>
        </div>
        <button class="expand-btn">Uitbreiden</button>
    </div>

    <!-- Search Bar -->
    <div class="search-container">
        <div class="search-bar">
            <span>🔍</span>
            <input type="text" id="search-input" placeholder="Zoeken">
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Navigation and Actions -->
        <div class="nav-actions">
            <div class="nav-path">
                <span>/</span>
                <span>Getfitted</span>
            </div>
            <div class="action-buttons">
                <button class="btn primary" onclick="showUploadModal()">
                    <span>📁</span>
                    Uploaden
                </button>
                <button class="btn" onclick="showNewFolderModal()">
                    <span>📂</span>
                    Nieuwe map
                </button>
                <button class="btn" onclick="showMoreMenu()">
                    <span>⋮</span>
                    Meer
                </button>
            </div>
        </div>

        <!-- File Table -->
        <div class="file-table-container">
            <table class="file-table">
                <thead>
                    <tr>
                        <th style="width: 40px;"></th>
                        <th style="width: 40px;">Type</th>
                        <th>Naam</th>
                        <th style="width: 120px;">Grootte</th>
                        <th style="width: 200px;">Laatste wijziging op</th>
                    </tr>
                </thead>
                <tbody id="file-table-body">
                    <!-- Files will be populated by JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <span id="item-count">0 items geselecteerd</span>
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Uploaden</h2>
                <button class="close-btn" onclick="closeUploadModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Bestanden selecteren</label>
                    <input type="file" id="file-upload" multiple>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn primary" onclick="uploadFiles()">Uploaden</button>
                <button class="btn" onclick="closeUploadModal()">Annuleren</button>
            </div>
        </div>
    </div>

    <!-- New Folder Modal -->
    <div id="newFolderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nieuwe map</h2>
                <button class="close-btn" onclick="closeNewFolderModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Mapnaam</label>
                    <input type="text" id="folder-name" placeholder="Voer mapnaam in">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn primary" onclick="createFolder()">Maken</button>
                <button class="btn" onclick="closeNewFolderModal()">Annuleren</button>
            </div>
        </div>
    </div>

    <!-- More Menu Modal -->
    <div id="moreMenuModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Meer acties</h2>
                <button class="close-btn" onclick="closeMoreMenu()">&times;</button>
            </div>
            <div class="modal-body">
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <button class="btn" onclick="selectAll(); closeMoreMenu();">Alles selecteren</button>
                    <button class="btn" onclick="deselectAll(); closeMoreMenu();">Selectie opheffen</button>
                    <button class="btn" onclick="deleteSelected(); closeMoreMenu();">Geselecteerde items verwijderen</button>
                    <button class="btn" onclick="refreshView(); closeMoreMenu();">Vernieuwen</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeMoreMenu()">Sluiten</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
